services:
  backend:
    build:
      context: .
      dockerfile: backend/PortfolioApi/Dockerfile
    container_name: portfolio-api
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: portfolio-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    restart: unless-stopped